name: SDR Monitor Alert

# 说明：高频（秒级）监控由本地常驻进程完成，见 deploy/README.md 与 deploy/sdr-monitor.service。
# 本 Actions 仅保留手动单次探测（--once），不再用 schedule 定时——GitHub Actions 定时最短 5 分钟，无法做到每秒。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDR_URL: "http://sdr.bh4dts.site:8073/status"
  TIMEOUT: "10"
  # Webhook 地址在仓库 Settings → Secrets and variables → Actions 中配置 WEBHOOK_URL；
  # 未配置时脚本自动跳过通知，不影响运行。
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor (once)
        run: python3 scripts/monitor.py --once

      - name: Commit metrics & state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monitor_state.json data/monitor_metrics.csv data/monitor.log
          if git diff --staged --quiet; then
            echo "无新指标，无需提交"
          else
            git commit -m "auto: 监控指标 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

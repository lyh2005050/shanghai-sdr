name: SDR Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDR status
        run: |
          mkdir -p data
          URL="http://sdr.bh4dts.site:8073/status"
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o data/status_new.txt --max-time 20 "$URL" || echo "000")
          echo "HTTP $HTTP_CODE"

          # 抓取失败（DNS/超时/连接错误）：保留上次状态，不中断工作流
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::warning::无法连接 SDR 站点，本次跳过更新"
            rm -f data/status_new.txt
            echo "FETCH_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # 返回的不是纯文本状态（如 HTML 面板首页）：判定为无效响应
          if head -c 200 data/status_new.txt | grep -qi "<html\|<doctype"; then
            echo "::warning::返回内容为 HTML 页面，非状态文本，本次跳过"
            rm -f data/status_new.txt
            echo "FETCH_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi

          mv data/status_new.txt data/status.txt
          echo "FETCH_OK=true" >> "$GITHUB_ENV"
          cat data/status.txt

      - name: Generate report
        if: env.FETCH_OK == 'true'
        run: |
          python3 scripts/analyze.py
          cat data/report.md

      - name: Commit if changed
        if: env.FETCH_OK == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: 更新状态 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

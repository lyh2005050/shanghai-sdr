name: SDR Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDR status
        run: |
          mkdir -p data
          curl -sS --max-time 20 https://yanamipink.cc.cd/status > data/status.txt
          echo "---"
          cat data/status.txt

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.txt
          git diff --staged --quiet || git commit -m "auto: 更新 SDR 状态 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

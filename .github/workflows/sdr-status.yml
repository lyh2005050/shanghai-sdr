name: SDR Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDR status
        run: |
          mkdir -p data
          if [ -f data/etag.txt ]; then
            ETAG=$(cat data/etag.txt)
            HTTP_CODE=$(curl -sS -w "%{http_code}" -H "If-None-Match: $ETAG" -o data/status_new.txt --max-time 20 https://yanamipink.cc.cd/status)
            if [ "$HTTP_CODE" = "304" ]; then
              echo "无变化，跳过"
              rm data/status_new.txt
              echo "CHANGED=false" >> $GITHUB_ENV
              exit 0
            fi
            mv data/status_new.txt data/status.txt
          else
            curl -sS -D data/headers.txt --max-time 20 https://yanamipink.cc.cd/status > data/status.txt
            grep -i "etag:" data/headers.txt | sed 's/[Ee][Tt][Aa][Gg]: //I' | tr -d '\r\n' > data/etag.txt
          fi
          cat data/status.txt

      - name: Generate report
        run: |
          python3 scripts/analyze.py
          cat data/report.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "auto: 更新状态 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

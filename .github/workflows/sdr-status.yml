name: SDR Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # 监控目标（KiwiSDR 状态端点）
  SDR_URL: "http://sdr.bh4dts.site:8073/status"
  REQUEST_TIMEOUT: "20"
  MAX_RETRY: "2"

jobs:
  fetch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDR status (with retry)
        id: fetch
        run: |
          mkdir -p data
          CODE="000"
          for attempt in $(seq 0 "${{ env.MAX_RETRY }}"); do
            CODE=$(curl -sS -w "%{http_code}" -o data/status_new.txt \
              --max-time "${{ env.REQUEST_TIMEOUT }}" "${{ env.SDR_URL }}" || echo "000")
            echo "第 $((attempt+1)) 次尝试 -> HTTP $CODE"
            if [ "$CODE" != "000" ]; then break; fi
            sleep 3
          done
          echo "final_code=$CODE" >> "$GITHUB_OUTPUT"

          # 连接失败（DNS / 超时 / 拒绝）：保留上次状态，本次不更新，工作流不算失败
          if [ "$CODE" = "000" ]; then
            echo "::warning::无法连接 SDR 站点，本次跳过更新"
            rm -f data/status_new.txt
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 返回 HTML 面板页而非纯文本状态：判定无效
          if head -c 200 data/status_new.txt | grep -qi "<html\|<doctype"; then
            echo "::warning::返回内容为 HTML 页面，非状态文本，本次跳过"
            rm -f data/status_new.txt
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mv data/status_new.txt data/status.txt
          echo "fetch_ok=true" >> "$GITHUB_OUTPUT"
          echo "---- 原始状态 ----"
          cat data/status.txt

      - name: Generate report
        if: steps.fetch.outputs.fetch_ok == 'true'
        run: |
          python3 scripts/analyze.py
          echo "---- 生成的报告 ----"
          cat data/report.md

      - name: Commit if changed
        if: steps.fetch.outputs.fetch_ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "状态无变化，无需提交"
          else
            git commit -m "auto: 更新状态 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海 SDR 实时监控面板</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#131a26; --panel2:#1a2333; --line:#243044;
    --txt:#e6edf6; --sub:#8fa3bd; --ok:#2ee6a8; --warn:#ffb454; --bad:#ff5d6c;
    --accent:#4cc2ff; --violet:#9d7bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%,#16233a 0%,var(--bg) 55%);
    color:var(--txt); font-family:"Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; padding:22px clamp(14px,4vw,34px);
  }
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:20px}
  .badge{width:14px;height:14px;border-radius:50%;background:var(--sub);box-shadow:0 0 12px var(--sub)}
  .badge.ok{background:var(--ok);box-shadow:0 0 14px var(--ok)}
  .badge.bad{background:var(--bad);box-shadow:0 0 14px var(--bad)}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--sub);font-size:13px}
  .spacer{flex:1}
  .clock{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
  .pill{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--sub)}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .kpi .label{color:var(--sub);font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .kpi .value{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .foot{color:var(--sub);font-size:12px;margin-top:6px}
  .kpi .value small{font-size:14px;color:var(--sub);font-weight:500}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2 .tag{color:var(--sub);font-size:12px;font-weight:400}
  canvas{width:100%;height:220px;display:block}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:700px){.meta{grid-template-columns:repeat(2,1fr)}}
  .meta .item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .meta .item .l{color:var(--sub);font-size:12px;margin-bottom:5px}
  .meta .item .v{font-size:15px;font-weight:600;word-break:break-all}
  .statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .online-txt{font-weight:700;font-size:16px}
  .online-txt.ok{color:var(--ok)} .online-txt.bad{color:var(--bad)}
  footer{color:var(--sub);font-size:12px;margin-top:10px;text-align:center}
  .err{color:var(--bad);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span id="dot" class="badge"></span>
    <div>
      <h1>上海 SDR 实时监控面板</h1>
      <div class="sub" id="sdr-name">—</div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="event-pill">状态机：—</span>
    <span class="clock" id="clock">—</span>
  </header>

  <div class="grid">
    <div class="card kpi">
      <div class="label">当前状态</div>
      <div class="value"><span id="k-status">—</span></div>
      <div class="foot" id="k-latency">延迟 —</div>
    </div>
    <div class="card kpi">
      <div class="label">在线用户</div>
      <div class="value"><span id="k-users">—</span><small id="k-users-max">/ —</small></div>
      <div class="foot" id="k-users-ratio">占用 —</div>
    </div>
    <div class="card kpi">
      <div class="label">SNR 信噪比</div>
      <div class="value" id="k-snr">—</div>
      <div class="foot">天线 <span id="k-antenna">—</span></div>
    </div>
    <div class="card kpi">
      <div class="label">GPS 卫星</div>
      <div class="value" id="k-gps">—</div>
      <div class="foot" id="k-gpsloc">坐标 —</div>
    </div>
  </div>

  <div class="panel">
    <h2>用户数趋势 <span class="tag" id="chart-hint">近 120 条采样</span></h2>
    <canvas id="chart" height="220"></canvas>
  </div>

  <div class="panel">
    <h2>站点信息</h2>
    <div class="meta">
      <div class="item"><div class="l">硬件</div><div class="v" id="m-hw">—</div></div>
      <div class="item"><div class="l">固件版本</div><div class="v" id="m-sw">—</div></div>
      <div class="item"><div class="l">运行时间</div><div class="v" id="m-uptime">—</div></div>
      <div class="item"><div class="l">接收频段</div><div class="v" id="m-bands">—</div></div>
      <div class="item"><div class="l">海拔</div><div class="v" id="m-asl">—</div></div>
      <div class="item"><div class="l">天线连接</div><div class="v" id="m-ant">—</div></div>
    </div>
    <div class="err" id="err-box"></div>
  </div>

  <footer>数据来自本地常驻监控 monitor.py · 每 5 秒自动刷新</footer>
</div>

<script>
const $ = id => document.getElementById(id);
let metricsCache = [];

function fmt(n, d="—"){ return (n===null||n===undefined||n==="") ? d : n; }

function renderStatus(d){
  const ok = d.online;
  const dot = $("dot");
  dot.className = "badge " + (ok ? "ok" : "bad");
  $("sdr-name").textContent = d.info.name || "0-30 MHz SDR";
  $("k-status").textContent = ok ? "在线" : "离线/不可达";
  $("k-status").className = "online-txt " + (ok ? "ok" : "bad");
  $("k-latency").textContent = "延迟 " + fmt(d.latency_ms) + " ms" + (d.error ? " · 回源失败" : "");

  $("k-users").textContent = fmt(d.info.users);
  $("k-users-max").textContent = "/ " + fmt(d.info.users_max);
  if(d.info.users!=null && d.info.users_max){
    const r = Math.round(d.info.users/d.info.users_max*100);
    $("k-users-ratio").textContent = "占用率 " + r + "%";
  } else $("k-users-ratio").textContent = "占用 —";

  $("k-snr").textContent = fmt(d.info.snr);
  $("k-antenna").textContent = fmt(d.info.antenna);

  $("k-gps").textContent = fmt(d.info.gps_good);
  if(d.info.gps_lat!=null) $("k-gpsloc").textContent = d.info.gps_lat.toFixed(2) + ", " + d.info.gps_lon.toFixed(2);
  else $("k-gpsloc").textContent = "坐标 —";

  $("m-hw").textContent = fmt(d.info.sdr_hw);
  $("m-sw").textContent = fmt(d.info.sw_version);
  $("m-uptime").textContent = fmt(d.info.uptime);
  $("m-bands").textContent = fmt(d.info.bands);
  $("m-asl").textContent = d.info.asl!=null ? d.info.asl + " m" : "—";
  $("m-ant").textContent = d.info.ant_connected==="1" ? "已连接" : (d.info.ant_connected==="0" ? "未连接" : "—");

  const evMap = {init:"首次记录", down:"掉线", recovered:"恢复在线", none:"稳定"};
  $("event-pill").textContent = "状态机：" + (evMap[d.state_event] || d.state_event || "—");
  $("err-box").textContent = d.error ? ("回源错误：" + d.error) : "";
  $("clock").textContent = d.checked_at || "—";
}

function drawChart(){
  const c = $("chart"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  c.width = W*dpr; c.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const rows = metricsCache.slice(-120);
  const padL=38, padR=12, padT=14, padB=24;
  if(!rows.length){ ctx.fillStyle="#8fa3bd"; ctx.font="13px sans-serif"; ctx.fillText("暂无趋势数据", padL, H/2); return; }

  const users = rows.map(r=>parseFloat(r.users)).filter(n=>!isNaN(n));
  const maxU = Math.max(3, ...rows.map(r=>parseFloat(r.users_max)||3));
  const minU = 0;
  const x = i => padL + (W-padL-padR) * (rows.length===1?0.5:i/(rows.length-1));
  const y = v => padT + (H-padT-padB) * (1 - (v-minU)/(maxU-minU));

  // 网格 + Y 轴
  ctx.strokeStyle="#243044"; ctx.fillStyle="#8fa3bd"; ctx.font="11px sans-serif";
  for(let g=0; g<=4; g++){
    const v = minU + (maxU-minU)*g/4, yy = y(v);
    ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(W-padR,yy); ctx.stroke();
    ctx.fillText(Math.round(v), 6, yy+4);
  }
  // X 轴时间标签（首/中/尾）
  const lab = i => rows[i] ? rows[i].time.slice(5,16) : "";
  ctx.fillText(lab(0), padL, H-8);
  if(rows.length>2){ ctx.fillText(lab(Math.floor(rows.length/2)), W/2-30, H-8); ctx.fillText(lab(rows.length-1), W-padR-58, H-8); }

  // 面积 + 折线
  const pts = rows.map((r,i)=>[x(i), y(parseFloat(r.users)||0)]);
  ctx.beginPath();
  pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  const grad = ctx.createLinearGradient(0,padT,0,H-padB);
  grad.addColorStop(0,"rgba(76,194,255,.35)"); grad.addColorStop(1,"rgba(76,194,255,0)");
  ctx.save();
  ctx.lineTo(pts[pts.length-1][0], H-padB); ctx.lineTo(pts[0][0], H-padB); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill(); ctx.restore();

  ctx.beginPath();
  pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle="#4cc2ff"; ctx.lineWidth=2; ctx.stroke();

  // 数据点
  ctx.fillStyle="#4cc2ff";
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2.5,0,Math.PI*2);ctx.fill();});
}

async function refresh(){
  try{
    const [s, m] = await Promise.all([
      fetch("/api/status").then(r=>r.json()),
      fetch("/api/metrics").then(r=>r.json())
    ]);
    renderStatus(s);
    metricsCache = m.metrics || [];
    drawChart();
  }catch(e){
    $("err-box").textContent = "接口请求失败：" + e.message;
  }
}

window.addEventListener("resize", drawChart);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
